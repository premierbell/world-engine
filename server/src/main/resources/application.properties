spring.application.name=server
openai.api-key=${OPENAI_API_KEY}
openai.base-url=https://api.openai.com/v1
openai.embedding-model=text-embedding-3-small
openai.chat-model=gpt-4o-mini
scrap.max-summary-length=2000
scrap.max-fullpage-length=6000
# 스키마는 Flyway(src/main/resources/db/migration)가 관리한다. Hibernate는 엔티티와 스키마가 맞는지 검사만 한다.
spring.jpa.hibernate.ddl-auto=validate
# Flyway 도입 전부터 있던 DB(테이블은 있고 이력 테이블은 없음)는 V1을 실행하지 않고 "적용됨"으로만 표시한다.
# 빈 DB에는 영향 없음(V1이 그대로 실행됨). 한 번 표시된 DB에서는 다시 동작하지 않는다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
extraction.min-content-length=50