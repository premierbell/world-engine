<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Engine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <main class="main">
    <h1>World Engine</h1>

    <section class="card">
      <h2>스크랩</h2>
      <form id="scrap-form">
        <input type="url" id="url-input" placeholder="https://..." required>
        <input type="text" id="context-input" placeholder="왜 저장했나요? (선택)">
        <button type="submit">스크랩</button>
      </form>
      <p id="scrap-result" class="result"></p>
    </section>

    <section class="card" id="recommend-section" hidden>
      <h2>추천 Island</h2>
      <ul id="recommend-list" class="recommend-list"></ul>
      <div class="new-island">
        <select id="other-island-select">
          <option value="">다른 Island 선택...</option>
        </select>
        <button type="button" id="other-island-confirm">이 Island로 확정</button>
      </div>
      <div class="new-island">
        <input type="text" id="new-island-input" placeholder="새 Island 이름">
        <button id="new-island-confirm">새 Island로 확정</button>
      </div>
      <p id="confirm-result" class="result"></p>
    </section>

    <section class="card" id="island-detail-section" hidden>
      <h2 id="island-detail-title">Island</h2>
      <div class="island-signals">
        <div class="signal">
          <span class="signal-label">Cosine Variance</span>
          <span class="signal-value" id="island-detail-variance">-</span>
        </div>
        <div class="signal">
          <span class="signal-label">Override Rate</span>
          <span class="signal-value" id="island-detail-override">-</span>
        </div>
      </div>
      <p class="signal-note">참고용 관찰 지표입니다 - 이 값이 무언가를 자동으로 결정하지 않습니다.</p>

      <button type="button" id="topic-candidates-button">Topic 후보 찾기</button>
      <p id="topic-candidates-status" class="result"></p>
      <div id="topic-candidates-result"></div>

      <div id="island-topics"></div>

      <div class="topic-create-form">
        <input type="text" id="topic-name-input" placeholder="Topic 이름">
        <button type="button" id="create-topic-button">선택한 스크랩으로 Topic 생성</button>
      </div>
      <p id="topic-create-result" class="result"></p>

      <ul id="island-detail-scraps" class="entity-list"></ul>
    </section>
  </main>

  <aside class="sidebar">
    <section class="card">
      <h2>Islands <button class="refresh" id="refresh-islands">↻</button></h2>
      <ul id="island-list" class="entity-list"></ul>
    </section>
    <section class="card">
      <h2>정리할 스크랩 <button class="refresh" id="refresh-pending">↻</button></h2>
      <ul id="pending-list" class="entity-list pending-list"></ul>
    </section>
    <section class="card">
      <h2>최근 Scraps <button class="refresh" id="refresh-scraps">↻</button></h2>
      <ul id="scrap-list" class="entity-list"></ul>
    </section>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
