name: CI

# develop/main으로 가는 PR과 두 브랜치에 push될 때 서버 테스트와 클라이언트 빌드를 검증한다.
# 기본 서버 테스트는 H2와 Mock만 써서 OpenAI 키가 필요 없다. 예외로 FlywayMigrationTest는 Testcontainers Postgres를
# 띄워 마이그레이션과 Entity가 맞는지 검증한다(GitHub Actions 러너에는 Docker가 있음, 로컬에 Docker가 없으면 건너뜀).
# 외부 네트워크(live)·대용량 측정(benchmark) 태그 테스트는 build.gradle.kts의 test 태스크에서 이미 제외된다.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server tests (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --no-daemon

      # 성공해도 올린다 - 로그만으로는 Docker가 필요한 테스트(FlywayMigrationTest)가 실행됐는지 건너뛰었는지 알 수 없다
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: |
            server/build/reports/tests/test
            server/build/test-results/test
          retention-days: 14

  client:
    name: Client lint & build (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
