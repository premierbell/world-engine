<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>World Engine 스크랩</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <h1>World Engine</h1>
      <p id="status">현재 페이지를 스크랩하는 중...</p>

      <div id="result" hidden>
        <p id="scrap-title" class="scrap-title"></p>

        <div id="recommend-section">
          <h2>추천 Island</h2>
          <div id="recommendations" class="recommend-list"></div>
        </div>

        <div class="section">
          <label for="other-island-select">다른 Island 선택</label>
          <div class="row">
            <select id="other-island-select">
              <option value="">Island를 고르세요</option>
            </select>
            <button id="confirm-other" type="button">확정</button>
          </div>
        </div>

        <div class="section">
          <label for="new-island-name">새 Island 만들기</label>
          <div class="row">
            <input type="text" id="new-island-name" placeholder="새 Island 이름" />
            <button id="confirm-new" type="button">확정</button>
          </div>
        </div>
      </div>

      <p id="confirm-message" class="result"></p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
